name: Crawl FPT Smart Cloud jobs

on:
  schedule:
    - cron: '0 * * * *' # every hour, on the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl-jobs
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Crawl jobs
        run: npm run crawl

      - name: Classify jobs
        run: npm run classify

      - name: Translate jobs
        # An API outage must not hold back the job data itself; untranslated jobs are retried next run.
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: npm run translate

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- public/data)" ]; then
            echo "No job changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore: update FPT Smart Cloud jobs"
          # Someone may have pushed while the crawl ran; only the bot touches these files, so rebase is clean.
          git pull --rebase
          git push
